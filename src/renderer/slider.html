<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; script-src 'self'"
    />
    <title>透明度</title>
    <style>
      html,
      body {
        margin: 0;
        background: transparent;
        overflow: hidden;
        font: 12px/1.5 "Segoe UI", "Microsoft YaHei", system-ui, sans-serif;
        color: #e8eef6;
        user-select: none;
      }
      .panel {
        margin: 4px;
        padding: 8px 12px 12px;
        background: rgb(18 22 27 / 98%);
        border: 1px solid #333d49;
        border-radius: 10px;
      }
      .row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 8px;
      }
      b {
        font-family: Consolas, monospace;
      }
      .track {
        position: relative;
        height: 16px;
        cursor: ew-resize;
      }
      .track::before {
        content: '';
        position: absolute;
        left: 0;
        right: 0;
        top: 6px;
        height: 3px;
        border-radius: 2px;
        background: #ffffff;
      }
      .knob {
        position: absolute;
        top: 2px;
        width: 12px;
        height: 12px;
        margin-left: -6px;
        border-radius: 50%;
        background: #fff;
        border: 2px solid #12161b;
        box-shadow: 0 0 0 1px #ffffff;
      }
    </style>
  </head>
  <body>
    <div class="panel">
      <div class="row">
        <span>透明度</span>
        <b id="value" class="mono">—</b>
      </div>
      <div id="track" class="track" title="按住左右拖动">
        <i id="knob" class="knob"></i>
      </div>
    </div>
    <script type="module" src="./slider.ts"></script>
  </body>
</html>
