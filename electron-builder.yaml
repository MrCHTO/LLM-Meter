appId: dev.edgeless.llmmeter
productName: LLM Meter
directories:
  output: dist
  buildResources: resources
# 直接用已安装的 Electron 产物，避免打包时再联网下载
electronDist: node_modules/electron/dist
files:
  - out/**/*
  - resources/icon.png
  - resources/icon.ico
  - resources/tray.ico
  - package.json
  - LICENSE
asar: true
win:
  icon: resources/icon.ico
  target:
    - target: nsis
      arch: [x64]
  artifactName: LLM-Meter-v${version}-win-x64-setup.${ext}
nsis:
  oneClick: false
  perMachine: true
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  shortcutName: LLM Meter
  include: resources/installer.nsh
