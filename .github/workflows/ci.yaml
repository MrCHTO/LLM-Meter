name: CI

# 触发策略：
# - 推送只覆盖 develop 与临时分支（临时分支形如 type/描述）；main / release 不直推、只经 PR 接收，所以不列在 push 下。
# - PR 只针对 develop（临时分支合入）与 release（main 发版合入），其余方向不跑。
on:
  push:
    branches:
      - develop
      - "feature/*"
      - "bugfix/*"
      - "hotfix/*"
      - "docs/*"
      - "revert/*"
      - "refactor/*"
      - "test/*"
      - "chore/*"
  pull_request:
    branches:
      - develop
      - release

# 同一分支连续推送时取消上一轮，避免排队与产物互相覆盖。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 常规校验：develop 推送、临时分支推送、任意 PR 到 develop / release 都要过这四项。
  quality:
    # 项目是 Electron 应用，ui-check、installed-check 等脚本依赖 Windows 特性，不换 Linux。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      # 用 ci 而非 install，锁 package-lock.json，保证与本地安装结果一致。
      - name: 安装依赖
        run: npm ci
      - name: 格式检查
        run: npm run format:check
      # 静态代码分析由项目既有 eslint 承担，不引入额外扫描器。
      - name: 静态代码分析
        run: npm run lint
      - name: 类型检查
        run: npm run typecheck
      # 分两段扫描：生产依赖必须干净，出问题直接阻断；构建与测试工具链的漏洞多要跨大版本升级才修得掉，
      # 只报不卡，避免长期把 CI 挂成红色而失去参考价值。
      - name: 安全扫描（生产依赖）
        run: npm audit --omit=dev --audit-level=high
      - name: 安全扫描（开发依赖）
        run: npm audit --audit-level=high
        continue-on-error: true
      - name: 单元测试
        run: npm test

  # 发版构建：只在 main -> release 的 PR 上执行，且依赖 quality 全过。
  # 临时分支 PR 与 develop 推送都不构建，避免重复产安装包。
  release:
    if: github.event_name == 'pull_request' && github.base_ref == 'release' && github.head_ref == 'main'
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      # npm ci 会跳过 electron 的 postinstall，node_modules/electron/dist 不存在，
      # 而 electron-builder.yaml 用 electronDist 指向该目录，故这里手动补下载。
      - name: 下载 Electron 运行时
        run: node node_modules/electron/install.js
      # 前置条件：electron-builder 的 artifactName 已去掉空格，产物形如 LLM-Meter-v1.0.0-win-x64-setup.exe。
      - name: 发版构建
        run: npm run dist
      # 校验文件与安装包同名加 .sha256，内容为小写哈希 + 空格星号 + 文件名，可被 sha256sum -c 直接使用。
      - name: 生成 SHA256 校验文件
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*-setup.exe | Select-Object -First 1
          if (-not $exe) { throw '未找到安装包' }
          $sha = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$($exe.FullName).sha256", "$sha *$($exe.Name)`n")
      # 产物缺失直接失败，不产出空 artifact 让人误判。
      - name: 上传构建产物
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*-setup.exe
            dist/*-setup.exe.sha256
          if-no-files-found: error
