name: CI

# 触发策略（对齐 WorkFlow 规范）：
# - 推送覆盖 develop 与临时分支（临时分支形如 type/描述）；main / release 不直推、只经 PR 接收。
# - PR 只覆盖 develop 与 main 两个目标；main -> release 的 PR 不跑 CI，由 tag 阶段的单测与构建兜底。
# - 版本 tag 只打在 release 分支的发布提交上，故 tag 推送单独触发发版流水线。
on:
  push:
    branches:
      - develop
      - "feature/*"
      - "bugfix/*"
      - "hotfix/*"
      - "docs/*"
      - "revert/*"
      - "refactor/*"
      - "test/*"
      - "chore/*"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - develop

# 同一分支或 tag 连续推送时取消上一轮，避免排队与产物互相覆盖。
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 常规校验：所有分支推送与所有 PR 都只跑这六步，不构建、不发布。
  quality:
    name: 质量检查
    # 项目是 Electron 应用，ui-check、installed-check 等脚本依赖 Windows 特性，不换 Linux。
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - name: 准备运行环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      # 用 ci 而非 install，锁 package-lock.json，保证与本地安装结果一致。
      - name: 安装依赖
        run: npm ci
      - name: 格式检查
        run: npm run format:check
      # 静态代码分析由项目既有 eslint 承担，不引入额外扫描器。
      - name: 静态代码分析
        run: npm run lint
      - name: 类型检查
        run: npm run typecheck
      # 分两段扫描：生产依赖必须干净，出问题直接阻断；构建与测试工具链的漏洞多要跨大版本升级才修得掉，
      # 只报不卡，避免长期把 CI 挂成红色而失去参考价值。
      - name: 安全扫描（生产依赖）
        run: npm audit --omit=dev --audit-level=high
      - name: 安全扫描（开发依赖）
        run: npm audit --audit-level=high
        continue-on-error: true
      # 单元测试只在 PR 上跑，推送时省一轮，加快日常提交反馈。
      - name: 单元测试
        if: github.event_name == 'pull_request'
        run: npm test
      # 仅 develop -> main 的 PR 验一次能否出包，避免到 tag 阶段才发现打包链路坏了。
      # 构建用的 electron 运行时同样只在此时补下载，其余 PR 不承担这部分时间。
      - name: 下载 Electron 运行时（构建测试用）
        if: github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main'
        run: node node_modules/electron/install.js
      - name: 构建测试
        if: github.event_name == 'pull_request' && github.head_ref == 'develop' && github.base_ref == 'main'
        run: npm run dist

  # 发版构建：只由 release 分支上的 tag 推送触发，复用 quality 的六步后再构建并建草稿发行版。
  release:
    name: 发版构建
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: 准备运行环境
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
      - name: 安装依赖
        run: npm ci
      - name: 格式检查
        run: npm run format:check
      - name: 静态代码分析
        run: npm run lint
      - name: 类型检查
        run: npm run typecheck
      - name: 安全扫描（生产依赖）
        run: npm audit --omit=dev --audit-level=high
      - name: 安全扫描（开发依赖）
        run: npm audit --audit-level=high
        continue-on-error: true
      # 发版 job 自己跑一遍单测，不依赖 quality 的阶段（quality 里那条只在 PR 生效）。
      - name: 单元测试
        run: npm test
      # npm ci 会跳过 electron 的 postinstall，node_modules/electron/dist 不存在，
      # 而 electron-builder.yaml 用 electronDist 指向该目录，故这里手动补下载。
      - name: 下载 Electron 运行时
        run: node node_modules/electron/install.js
      # 前置条件：electron-builder 的 artifactName 已去掉空格，产物形如 LLM-Meter-v1.0.0-win-x64-setup.exe。
      # 关闭隐式发布写在 package.json 的 dist 脚本里，这里不必再传 --publish。
      - name: 发版构建
        run: npm run dist
      # 发行版固定为草稿，标题取 tag，说明由提交记录自动生成，人工确认后自行发布。
      # pwsh 不展开通配符，先取到实际文件再作为参数展开，避免 gh 收到字面量。
      - name: 创建草稿发行版并上传产物
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          $files = @(Get-ChildItem dist/*-setup.exe | ForEach-Object FullName)
          if ($files.Count -eq 0) { throw '未找到发版产物' }
          gh release create $env:TAG --draft --title $env:TAG --generate-notes @files
