<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- LLM Meter：深色底 + 多条路由汇聚到一个节点，再单路输出 -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1220"/>
      <stop offset="1" stop-color="#1d2a3d"/>
    </linearGradient>
    <linearGradient id="route" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="out" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#7dd3fc"/>
      <stop offset="1" stop-color="#e0f2fe"/>
    </linearGradient>
  </defs>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="url(#bg)"/>
  <rect x="24" y="24" width="464" height="464" rx="116" fill="none" stroke="#2b3c54" stroke-width="6"/>

  <!-- 三条来源路由 -->
  <path d="M 104 128 C 180 128 186 214 232 244" fill="none" stroke="url(#route)" stroke-width="22" stroke-linecap="round" opacity="0.75"/>
  <path d="M 88 256 C 160 256 180 256 224 256" fill="none" stroke="url(#route)" stroke-width="26" stroke-linecap="round"/>
  <path d="M 104 384 C 180 384 186 298 232 268" fill="none" stroke="url(#route)" stroke-width="22" stroke-linecap="round" opacity="0.75"/>

  <!-- 来源端点 -->
  <circle cx="96" cy="128" r="17" fill="#22d3ee"/>
  <circle cx="80" cy="256" r="20" fill="#22d3ee"/>
  <circle cx="96" cy="384" r="17" fill="#22d3ee"/>

  <!-- 汇聚节点 -->
  <circle cx="252" cy="256" r="46" fill="#0e7490"/>
  <circle cx="252" cy="256" r="46" fill="none" stroke="#67e8f9" stroke-width="10"/>
  <circle cx="252" cy="256" r="17" fill="#e0f2fe"/>

  <!-- 聚合输出 -->
  <path d="M 302 256 L 388 256" fill="none" stroke="url(#out)" stroke-width="30" stroke-linecap="round"/>
  <path d="M 372 228 L 412 256 L 372 284" fill="none" stroke="#e0f2fe" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
